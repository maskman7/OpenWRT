# aria2 配置 —— ER1 内置（2GB RAM / 8GB eMMC / 下载目录固定在 U 盘）
# 所有落盘路径都在 /mnt/usb 下，U 盘未挂载时服务不会启动，见 /etc/init.d/aria2。

dir=/mnt/usb/downloads
continue=true
# 预分配：prealloc 对 ext4 / FAT / exFAT 都安全，不挑盘；
# 若确定用 ext4，可改成 falloc（秒级分配，更快）
file-allocation=prealloc
# 2GB 内存：64MB 磁盘缓存，够用且不挤占系统
disk-cache-size=67108864
max-concurrent-downloads=4
max-connection-per-server=16
split=16
min-split-size=4M
# 单任务最多 16 连接，避免把家用宽带和路由器 conntrack 打满
max-download-limit=0
max-overall-download-limit=0

# JSON-RPC：AriaNg 由浏览器直连 6800，必须允许跨端口跨域
enable-rpc=true
rpc-listen-all=true
rpc-allow-origin-all=true
rpc-listen-port=6800
# 口令留空：首次启动由 /etc/uci-defaults/97-aria2-secret 随机生成并回填
# （生成结果同时存到 /root/aria2_rpc_secret.txt，ssh 上去 cat 即得）
# 固定口令写进公开固件等于没有口令，所以这里刻意不放值
rpc-secret=

# BT / 磁力
enable-dht=true
bt-enable-lpd=true
listen-port=51413
dht-listen-port=51413
bt-max-peers=60
# 下完不做种（省上传与磁盘占用），要做种改成正数
seed-time=0
follow-torrent=mem

# 会话持久化：重启后任务列表可恢复
save-session=/mnt/usb/downloads/.aria2/session
input-file=/mnt/usb/downloads/.aria2/session
save-session-interval=30
auto-save-interval=30

# 日志级别，出错信息进 syslog（procd 接管 stdout/stderr）
log-level=warn
